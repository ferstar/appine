name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-arm64:
    name: Linux arm64
    # 设计文档 §13.3：lockstep 以真实的 arm64 硬件作为标准答案
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # llvm-mc 用来独立核对解释器的指令白名单（tests/lockstep/tests/whitelist.rs）
      - name: Install llvm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends llvm

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # M1b 的端到端测试在 Alpine minirootfs 里运行 busybox；版本和 sha256 固定在脚本里
      - uses: actions/cache@v4
        with:
          path: target/rootfs
          key: rootfs-${{ hashFiles('scripts/fetch-rootfs') }}

      - name: Fetch rootfs
        run: scripts/fetch-rootfs

      - name: Test (includes lockstep, guest programs and busybox in the rootfs)
        env:
          APPINE_REQUIRE_ROOTFS: "1"
        run: cargo test --workspace

      - name: Lockstep (extended)
        run: cargo run --release -p appine-lockstep -- --iterations 200000

      # M2 性能探针：在另一种 arm64 微架构上记录 Tier 1 的开销。
      # 只检查三种运行方式的输出一致，不设耗时门槛
      - name: Performance probe
        run: |
          cargo build --release -p appine-run -p appine-bench
          target/release/appine-bench --runs 3 --skip-tier0

      # Android NDK 用 clang 编译 C 引擎，这里提前暴露 clang 特有的警告
      - name: Engine and oracle with clang
        env:
          CC: clang
          CARGO_TARGET_DIR: target/clang
        run: cargo test -p appine-engine -p appine-lockstep
