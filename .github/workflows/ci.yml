name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-arm64:
    name: Linux arm64
    # Design doc §13.3: lockstep uses real arm64 hardware as the reference answer
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # llvm-mc independently checks the interpreter's instruction whitelist
      # (tests/lockstep/tests/whitelist.rs); musl-gcc compiles the guest test programs linked with
      # musl (tests/guest/*.c)
      - name: Install llvm and musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends llvm musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # M1b's end-to-end tests run busybox in the Alpine minirootfs; the version and sha256 are
      # fixed in the script
      - uses: actions/cache@v6
        with:
          path: target/rootfs
          key: rootfs-${{ hashFiles('scripts/fetch-rootfs') }}

      - name: Fetch rootfs
        run: scripts/fetch-rootfs

      - name: Test (includes lockstep, guest programs and busybox in the rootfs)
        env:
          APPINE_REQUIRE_ROOTFS: "1"
          APPINE_REQUIRE_MUSL: "1"
        run: cargo test --workspace

      # M4's exit criterion: apk installs git and python3 from an Alpine mirror, and git clones a
      # repository over HTTPS. It depends on the internet, so it is a separate step, which makes it
      # easy to tell a network problem from a kernel one when it fails
      - name: Network (apk add, git clone)
        env:
          APPINE_NETWORK_TESTS: "1"
        run: cargo test -p appine-run --test rootfs_programs -- --exact apk_installs_packages_and_git_clones_over_https

      - name: Lockstep (extended)
        run: cargo run --release -p appine-lockstep -- --iterations 200000

      # M2 performance probe: records Tier 1's overhead on another arm64 microarchitecture.
      # Only checks that the three ways of running give the same output, with no time threshold
      - name: Performance probe
        run: |
          cargo build --release -p appine-run -p appine-bench
          target/release/appine-bench --runs 3 --skip-tier0

      # M7's exit criterion: the same scripts give the same output on appine (Tier 1) and on native
      # Alpine in docker. The first run installs the packages the test cases need with apk, which
      # depends on the internet. appine turns the guest's raw ICMP sockets into host ping sockets:
      # Ubuntu does not let regular users create those by default (ping_group_range is "1 0"), while
      # Android and the Docker container on the native side both allow all groups. rust-cache caches
      # the whole target/ and would restore part of a store left by an earlier run, so the store is
      # created afresh each time and deleted after the run, so that it is not saved into the cache
      # again
      - name: Differential tests
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          rm -rf target/difftest
          scripts/difftest
          rm -rf target/difftest

      # The Android NDK compiles the C engine with clang, so clang-specific warnings show up here
      # early
      - name: Engine and oracle with clang
        env:
          CC: clang
          CARGO_TARGET_DIR: target/clang
        run: cargo test -p appine-engine -p appine-lockstep

  android:
    name: Android APK
    # Google provides aapt2 for Linux only on x86_64, so the native library is cross-compiled on
    # x86_64
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain from rust-toolchain.toml and the Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Cache the dependencies and Gradle distributions under ~/.gradle: without the cache every run
      # downloads them, and the configuration phase takes about a minute
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          # The runner's preset ANDROID_NDK_ROOT points at another version; change both so cargo-ndk
          # does not warn
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: target/rootfs
          key: rootfs-${{ hashFiles('scripts/fetch-rootfs') }}

      - name: Fetch rootfs
        run: scripts/fetch-rootfs

      - name: Clippy for Android
        env:
          CARGO_TARGET_DIR: target/android
        run: cargo ndk -t arm64-v8a --platform 29 clippy --release -p appine-android -p appine-kernel -- -D warnings

      # The instrumentation tests that run on an emulator (app/src/androidTest) need KVM, so they
      # run locally
      - name: Build and lint
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: appine-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
