name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-arm64:
    name: Linux arm64
    # 设计文档 §13.3：lockstep 以真实的 arm64 硬件作为标准答案
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # llvm-mc 用来独立核对解释器的指令白名单（tests/lockstep/tests/whitelist.rs）；
      # musl-gcc 用来编译链接 musl 的 guest 测试程序（tests/guest/*.c）
      - name: Install llvm and musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends llvm musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # M1b 的端到端测试在 Alpine minirootfs 里运行 busybox；版本和 sha256 固定在脚本里
      - uses: actions/cache@v4
        with:
          path: target/rootfs
          key: rootfs-${{ hashFiles('scripts/fetch-rootfs') }}

      - name: Fetch rootfs
        run: scripts/fetch-rootfs

      - name: Test (includes lockstep, guest programs and busybox in the rootfs)
        env:
          APPINE_REQUIRE_ROOTFS: "1"
          APPINE_REQUIRE_MUSL: "1"
        run: cargo test --workspace

      # M4 的退出标准：apk 从 Alpine 镜像安装 git、python3，git 经由 HTTPS 克隆仓库。
      # 依赖外网，单独一步，失败时容易分清是网络还是内核的问题
      - name: Network (apk add, git clone)
        env:
          APPINE_NETWORK_TESTS: "1"
        run: cargo test -p appine-run --test rootfs_programs -- --exact apk_installs_packages_and_git_clones_over_https

      - name: Lockstep (extended)
        run: cargo run --release -p appine-lockstep -- --iterations 200000

      # M2 性能探针：在另一种 arm64 微架构上记录 Tier 1 的开销。
      # 只检查三种运行方式的输出一致，不设耗时门槛
      - name: Performance probe
        run: |
          cargo build --release -p appine-run -p appine-bench
          target/release/appine-bench --runs 3 --skip-tier0

      # M7 的退出标准：同样的脚本在 appine（Tier 1）和 docker 里的原生 Alpine 上输出一致。
      # 第一次运行时用 apk 安装用例需要的软件包，依赖外网
      - name: Differential tests
        run: scripts/difftest

      # Android NDK 用 clang 编译 C 引擎，这里提前暴露 clang 特有的警告
      - name: Engine and oracle with clang
        env:
          CC: clang
          CARGO_TARGET_DIR: target/clang
        run: cargo test -p appine-engine -p appine-lockstep

  android:
    name: Android APK
    # Google 只提供 x86_64 的 Linux 版 aapt2，所以在 x86_64 上交叉编译原生库
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml and the Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: target/rootfs
          key: rootfs-${{ hashFiles('scripts/fetch-rootfs') }}

      - name: Fetch rootfs
        run: scripts/fetch-rootfs

      - name: Clippy for Android
        env:
          CARGO_TARGET_DIR: target/android
        run: cargo ndk -t arm64-v8a --platform 29 clippy --release -p appine-android -p appine-kernel -- -D warnings

      # 在模拟器上运行的 instrumentation 测试（app/src/androidTest）需要 KVM，在本地运行
      - name: Build and lint
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: appine-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
