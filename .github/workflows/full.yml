name: Full tests

# The slow suites, kept off every push (ci.yml has the quick checks): the differential tests
# against native Linux (including Fuchsia Starnix's and gVisor's syscall tests), the extended
# lockstep run, the network test and the engine built with clang. They run
# every night on develop when it has new commits, on pushes to master, and on demand
# (`gh workflow run full.yml --ref <branch>`).
on:
  schedule:
    # 02:00 in China (UTC+8)
    - cron: "0 18 * * *"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The nightly run tests develop, and only when develop changed in the last day
  changed:
    name: Anything new
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] ||
              [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 90000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Build appine-run and ensure the Starnix and gVisor test tarballs are cached once before the
  # differential test shards fan out, so shards skip the Rust toolchain and never race to rebuild
  # the same suite cache on a miss.
  build:
    name: Build appine-run and test suites
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    outputs:
      starnix-key: ${{ steps.starnix-cache.outputs.cache-primary-key }}
      gvisor-key: ${{ steps.gvisor-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Fuchsia Starnix's syscall tests, which the starnix-* differential cases run (without them those
      # cases only print that they are missing). The Fuchsia commit and googletest version are fixed
      # in the script, so its hash keys the cache, and a miss rebuilds them (about four minutes).
      # This cache and gVisor's are restored and saved in steps of their own: actions/cache saves
      # only when the whole job succeeds, so a later failure would leave them never saved
      - id: starnix-cache
        uses: actions/cache/restore@v6
        with:
          path: target/starnix-tests
          key: starnix-tests-${{ hashFiles('scripts/build-starnix-tests', 'tests/starnix/compat/**') }}

      - name: Build Starnix's syscall tests
        run: scripts/build-starnix-tests

      - if: steps.starnix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target/starnix-tests
          key: ${{ steps.starnix-cache.outputs.cache-primary-key }}

      # gVisor's syscall tests, for the gvisor-* cases: only the programs those cases name are
      # built, so the list is part of the key (abseil and the test library make a miss take about
      # ten minutes)
      - name: List gVisor's test programs
        id: gvisor
        run: echo "programs=$(scripts/build-gvisor-tests --list | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - id: gvisor-cache
        uses: actions/cache/restore@v6
        with:
          path: target/gvisor-tests
          key: gvisor-tests-${{ hashFiles('scripts/build-gvisor-tests', 'tests/gvisor/**') }}-${{ steps.gvisor.outputs.programs }}

      - name: Build gVisor's syscall tests
        run: scripts/build-gvisor-tests

      - if: steps.gvisor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target/gvisor-tests
          key: ${{ steps.gvisor-cache.outputs.cache-primary-key }}

      # scripts/difftest does not build: it runs target/release/appine-run, which no other step builds
      - name: Build appine-run
        run: cargo build --release -p appine-run

      - uses: actions/upload-artifact@v7
        with:
          name: appine-run
          path: target/release/appine-run
          retention-days: 7
          overwrite: true

  # Network test, extended lockstep and clang engine build run in parallel with build and difftest
  checks:
    name: Network, lockstep & clang
    needs: changed
    if: needs.changed.outputs.run == 'true'
    # Design doc §13.3: lockstep uses real arm64 hardware as the reference answer
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # llvm-mc for the lockstep whitelist check, musl-gcc for the guest test programs
      - name: Install llvm and musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends llvm musl-tools

      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v6
        with:
          path: target/rootfs
          key: rootfs-${{ hashFiles('scripts/fetch-rootfs') }}

      - name: Fetch rootfs
        run: scripts/fetch-rootfs

      # M4's exit criterion: apk installs git and python3 from an Alpine mirror, and git clones a
      # repository over HTTPS. It depends on the internet, so it is a separate step, which makes it
      # easy to tell a network problem from a kernel one when it fails
      - name: Network (apk add, git clone)
        env:
          APPINE_REQUIRE_ROOTFS: "1"
          APPINE_NETWORK_TESTS: "1"
        run: cargo test -p appine-run --test rootfs_programs -- --exact apk_installs_packages_and_git_clones_over_https

      - name: Lockstep (extended)
        run: cargo run --release -p appine-lockstep -- --iterations 200000

      # The Android NDK compiles the C engine with clang: run its tests built that way too
      - name: Engine and oracle with clang
        env:
          CC: clang
          CARGO_TARGET_DIR: target/clang
        run: cargo test -p appine-engine -p appine-lockstep

  # M7's exit criterion: the same scripts give the same output on Appine (Tier 1) and on native
  # Alpine in docker. Split across independent runners so each shard stays single-lane (avoiding
  # multi-lane timing flakiness and store-clone duplication on ext4) while cutting wall time from
  # ~28 min to ~9 min. Each shard creates its store afresh and installs only the suite it needs.
  difftest:
    name: Differential tests (${{ matrix.shard }})
    needs: [changed, build]
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: gvisor-process
            suite: gvisor
          - shard: gvisor
            suite: gvisor
          - shard: starnix
            suite: starnix
          - shard: core-1
            suite: none
          - shard: core-2
            suite: none
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: appine-run
          path: target/release

      - name: Mark appine-run executable
        run: chmod +x target/release/appine-run

      # strace and gdb let the 30 s sampler inspect a guest thread stuck in the CI-only high-sy
      # regime, where /proc/<tid>/stack on an actively running thread returns only [<0>] 0x0
      - name: Install strace and gdb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace gdb

      - uses: actions/cache/restore@v6
        with:
          path: target/rootfs
          key: rootfs-${{ hashFiles('scripts/fetch-rootfs') }}

      - name: Fetch rootfs
        run: scripts/fetch-rootfs

      - if: matrix.suite == 'starnix'
        uses: actions/cache/restore@v6
        with:
          path: target/starnix-tests
          key: ${{ needs.build.outputs.starnix-key }}

      - if: matrix.suite == 'starnix'
        name: Ensure Starnix's syscall tests
        run: scripts/build-starnix-tests

      - if: matrix.suite == 'gvisor'
        uses: actions/cache/restore@v6
        with:
          path: target/gvisor-tests
          key: ${{ needs.build.outputs.gvisor-key }}

      - if: matrix.suite == 'gvisor'
        name: Ensure gVisor's syscall tests
        run: scripts/build-gvisor-tests

      # Appine turns the guest's raw ICMP sockets into host ping sockets: Ubuntu does not let
      # regular users create those by default (ping_group_range is "1 0"), while Android and the
      # Docker container on the native side both allow all groups. vmstat samples the runner every
      # 10 s meanwhile: Appine's side of some cases has taken tens of times its usual time on some
      # runs only. -R runs a failed group once more, so a group that fails only sometimes is
      # reported as flaky instead of failing the run
      - name: Differential tests
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          rm -rf target/difftest
          mapfile -t all_cases < <(cd tests/diff && LC_ALL=C ls *.sh | sed 's/\.sh$//')
          cases=()
          idx=0
          for name in "${all_cases[@]}"; do
            case "$name" in
              gvisor-process)
                if [ "${{ matrix.shard }}" = "gvisor-process" ]; then
                  cases+=("$name")
                fi
                ;;
              gvisor-*)
                if [ "${{ matrix.shard }}" = "gvisor" ]; then
                  cases+=("$name")
                fi
                ;;
              starnix-*)
                if [ "${{ matrix.shard }}" = "starnix" ]; then
                  cases+=("$name")
                fi
                ;;
              *)
                if [ "${{ matrix.shard }}" = "core-1" ] && [ $((idx % 2)) -eq 0 ]; then
                  cases+=("$name")
                elif [ "${{ matrix.shard }}" = "core-2" ] && [ $((idx % 2)) -eq 1 ]; then
                  cases+=("$name")
                fi
                idx=$((idx + 1))
                ;;
            esac
          done
          echo "Running ${#cases[@]} cases for shard ${{ matrix.shard }}: ${cases[*]}"
          [ "${#cases[@]}" -gt 0 ]
          vmstat -t 10 > target/vmstat.log 2>&1 &
          vmstat_pid=$!
          # Sample the top host threads and appine-run's running threads every 30 s to diagnose
          # CI-only high-sy slowdowns that do not trip the BKL watchdog. When the same (pid, tid,
          # comm) stays R across two consecutive samples, capture 1 s stat deltas (minflt/majflt/
          # utime/stime), a 2 s strace -c summary, 40 raw strace lines and a gdb backtrace (up to
          # twice per stuck thread).
          (
            set +e
            prev_r=""
            probed=""
            while sleep 30; do
              pids=$(pgrep -x appine-run || true)
              [ -n "$pids" ] || { prev_r=""; continue; }
              echo "=== $(date -u +%FT%TZ) ==="
              ps -eLo pid,tid,pcpu,stat,comm,wchan:32 --sort=-pcpu 2>/dev/null | head -n 6 || true
              cur_r=""
              for p in $pids; do
                ps -L -p "$p" -o tid,pcpu,stat,comm,wchan:32 2>/dev/null || continue
                for t in /proc/"$p"/task/*; do
                  [ -d "$t" ] || continue
                  tid=${t##*/}
                  stat=$(cat "$t/stat" 2>/dev/null) || continue
                  tail_stat=${stat##*) }
                  state=${tail_stat%% *}
                  [ "$state" = R ] || continue
                  comm=$(cat "$t/comm" 2>/dev/null || true)
                  sys=$(sudo -n cat "$t/syscall" 2>/dev/null || true)
                  echo "  R tid=$tid comm=$comm syscall=$sys"
                  sudo -n cat "$t/stack" 2>/dev/null | sed 's/^/    /' || true
                  key="$p:$tid:$comm"
                  cur_r="$cur_r $key "
                  case "$prev_r" in
                    *" $key "*)
                      cnt=$(printf '%s\n' $probed | grep -Fx -c "$key" || true)
                      if [ "$cnt" -lt 2 ]; then
                        probed="$probed $key"
                        echo "  --- deep probe #$((cnt + 1)) for $key ---"
                        s1=$(awk '{print $8,$10,$12,$13}' <<<"$tail_stat" 2>/dev/null || true)
                        sleep 1
                        stat2=$(cat "$t/stat" 2>/dev/null || true)
                        s2=$(awk '{print $8,$10,$12,$13}' <<<"${stat2##*) }" 2>/dev/null || true)
                        echo "  stat(minflt majflt utime stime): t0=($s1) t1=($s2)"
                        grep -E '^(State|SigPnd|ShdPnd|SigBlk|voluntary_ctxt_switches|nonvoluntary_ctxt_switches):' "$t/status" 2>/dev/null | sed 's/^/    /' || true
                        echo "  strace -c (2s):"
                        sudo -n timeout -s INT 2 strace -c -p "$tid" 2>&1 | sed 's/^/    /' || true
                        echo "  strace sample (40 lines):"
                        (sudo -n timeout -s INT 1 strace -y -p "$tid" 2>&1 || true) | head -n 40 | sed 's/^/    /' || true
                        echo "  gdb backtrace:"
                        sudo -n timeout 10 gdb -batch -ex "set pagination off" -ex "info threads" -ex "thread apply all bt 15" -p "$p" target/release/appine-run 2>&1 | sed 's/^/    /' || true
                      fi
                      ;;
                  esac
                done
              done
              prev_r="$cur_r"
            done
          ) > target/sy-sample.log 2>&1 &
          sample_pid=$!
          trap 'kill "$vmstat_pid" "$sample_pid" 2>/dev/null; pkill -P "$sample_pid" 2>/dev/null || true' EXIT
          scripts/difftest -R "${cases[@]}"

      # Every case's appine-run stderr (internal errors, BKL watchdog reports), the outputs of
      # failed cases and the vmstat/thread samples, whether the cases passed or not
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: difftest-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            target/difftest/*.appine.err
            target/difftest/failed/
            target/vmstat.log
            target/sy-sample.log
          if-no-files-found: ignore
