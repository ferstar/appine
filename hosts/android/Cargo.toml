[package]
name = "appine-android"
description = "appine's native library for the Android app (JNI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "appine"
crate-type = ["cdylib"]

[dependencies]
appine-kernel.workspace = true
jni = "0.21.1"
libc.workspace = true

[features]
# See appine-kernel's features of the same names; app/build.gradle.kts enables them in the debug app
test-hooks = ["appine-kernel/test-hooks"]
borrow-check = ["appine-kernel/borrow-check"]
