[package]
name = "appine-run"
description = "Run a guest program from the host terminal (development front end)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
appine-hal.workspace = true
appine-kernel.workspace = true

[features]
# 差分测试、LTP、普查都用这个前端的发布构建，默认让它们也查借用（appine-kernel 的同名特性）
default = ["borrow-check"]
borrow-check = ["appine-kernel/borrow-check"]

[dev-dependencies]
appine-bench.workspace = true
