[package]
name = "appine-run"
description = "Run a guest program from the host terminal (development front end)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
appine-hal.workspace = true
appine-kernel.workspace = true

[features]
# Differential tests, LTP and the survey all use this front end's release build, so by default they
# check borrows too (the appine-kernel feature of the same name)
default = ["borrow-check"]
borrow-check = ["appine-kernel/borrow-check"]

[dev-dependencies]
appine-bench.workspace = true
